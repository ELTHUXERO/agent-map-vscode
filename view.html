<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
:root{
  --run:#f5b942; --ok:#3fd0a0; --bad:#ff6b6b; --opus:#b794f6; --sonnet:#5ab0ff; --haiku:#3fd0a0;
  --card:color-mix(in srgb,var(--vscode-foreground) 5%,transparent);

}
*{box-sizing:border-box}
body{margin:0;padding:0 10px 18px;font:12px/1.45 var(--vscode-font-family);color:var(--vscode-foreground)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px}
.brand{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mut)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.live.on{color:var(--run)}.live.on i{background:var(--run);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 70%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.filters{margin-bottom:8px}
.pick{border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pick>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px}
.pick>summary::-webkit-details-marker{display:none}
.pick .pl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.pick summary b{font-weight:700}
.pick .pn{padding:0 7px;border-radius:999px;background:var(--card2);font-size:10.5px;font-variant-numeric:tabular-nums}
.pick .pc{margin-left:auto;color:var(--mut);transition:transform .15s}
.pick[open] .pc{transform:rotate(180deg)}
.pick .opts{display:flex;flex-direction:column;gap:3px;padding:4px 6px 6px;border-top:1px solid var(--line)}
.pick .fchip{border-radius:8px;text-align:left;display:flex;justify-content:space-between}
.fchip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.fchip b{color:var(--vscode-foreground);margin-left:4px;font-weight:600}

.fchip.on b{color:inherit}
.kpi{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--card2),var(--card));overflow:hidden}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr)}
.kc{padding:10px 10px 9px;min-width:0}
.kc+.kc{border-left:1px solid var(--line)}
.kc .l{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.kc .n{font-size:19px;font-weight:600;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.kc.run .n{color:var(--run)}
.kc.bad .n{color:var(--bad)}
.kc.bad{background:color-mix(in srgb,var(--bad) 9%,transparent)}
.alert{margin-top:8px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent);cursor:pointer}
.alert.warn{border-color:color-mix(in srgb,var(--run) 55%,transparent);background:color-mix(in srgb,var(--run) 10%,transparent)}
.alert .ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#111;font-weight:800;font-size:11px}
.alert.warn .ic{background:var(--run)}
.alert span.t{flex:1}.alert small{color:var(--mut)}
.seg{display:flex;gap:2px;margin:12px 0 10px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;position:sticky;top:0;z-index:5;background-color:var(--vscode-sideBar-background,var(--vscode-editor-background,#1e1e1e));background-image:linear-gradient(var(--card),var(--card));box-shadow:0 6px 8px -6px rgba(0,0,0,.5)}
.now{margin-top:4px;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--run) 12%,transparent);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{margin-top:4px;color:var(--mut);font-size:11px;font-style:italic;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.btnrep{width:100%;margin:2px 0 10px;border:1px solid var(--line);background:var(--card2);color:var(--vscode-foreground);border-radius:8px;padding:6px;font:inherit;font-weight:700;cursor:pointer}

.hd{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);margin-bottom:5px;font-variant-numeric:tabular-nums}

.seg{overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}

.pgrp{display:flex;align-items:center;gap:8px;margin:14px 2px 6px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.pgrp::after{content:'';flex:1;height:1px;background:currentColor;opacity:.3}.pgrp em{font-style:normal;opacity:.7}
.ppill{display:inline-block;padding:0 7px;border-radius:999px;font-size:10px;font-weight:700;color:#111}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:9px 10px;display:block}
.card>summary::-webkit-details-marker{display:none}
.card>summary{padding:7px 9px}.card>summary .sub{font-size:10.5px;margin-top:2px}.card>summary .chips.mini{margin-top:4px;gap:4px}.card>summary .chip{font-size:10px;padding:1px 6px}
.card>summary .ctxm{height:3px;margin-top:5px;border-radius:3px;background:var(--card2);overflow:hidden}.card>summary .ctxm i{display:block;height:100%;background:var(--ok)}
.card>summary .ctxm.warn i{background:var(--run)}.card>summary .ctxm.bad i{background:var(--bad)}
.card>summary .abrir{font-size:10px;padding:1px 6px;opacity:.75}
.card>.ctx,.card>.chips{margin:0 9px 6px}
.sh{display:flex;align-items:center;gap:8px}
.chev{margin-left:auto;color:var(--mut);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--card2);color:var(--mut);white-space:nowrap}
.pill.run{background:color-mix(in srgb,var(--run) 18%,transparent);color:var(--run)}

.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.run i{animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.nm{font-weight:700;font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{color:var(--mut);font-size:11px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{padding:1px 7px;border-radius:6px;background:var(--card2);font-size:10.5px;font-variant-numeric:tabular-nums}

select.proy,select.carp{background:var(--vscode-dropdown-background);color:var(--vscode-dropdown-foreground);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:10.5px;padding:1px 4px;max-width:150px}

.tl{position:relative;margin-left:8px;padding-left:16px;border-left:2px solid var(--line)}
.ev{position:relative;padding:0 0 12px}
.ev::before{content:"";position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--vscode-sideBar-background,transparent)}
.ev.nace{--c:var(--run)}.ev.termina{--c:var(--ok)}.ev.err{--c:var(--bad)}
.ev .t{color:var(--mut);font-size:10.5px;font-variant-numeric:tabular-nums}
.ev .x{font-weight:600}
.grp{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;display:flex;justify-content:space-between}
.node{margin:4px 0 0 0}
.kids{margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}

.tt{font-weight:600}

.dgrp .fi{width:14px;height:14px;flex:none;color:#4f8cff}
.dgrp .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgrp .cnt{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(79,140,255,.15);color:#7aa7ff;border:1px solid rgba(79,140,255,.3)}
.dgrp .gb{border:0;background:transparent;color:inherit;opacity:.55;cursor:pointer;font-size:12px;padding:0 3px;line-height:1}.dgrp .gb:hover{opacity:1}
.dgrp .gi{flex:1;min-width:0;font:inherit;letter-spacing:inherit;text-transform:none;background:var(--vscode-input-background);color:var(--vscode-input-foreground);border:1px solid #4f8cff;border-radius:5px;padding:2px 6px}

/* tarjeta compacta: una línea plegada, detalle al desplegar */
details.card{padding:0;margin:3px 0;border-radius:6px;border:1px solid var(--line);border-left-width:3px;background:transparent;box-shadow:none}
details.card[open]{background:var(--card);padding-bottom:8px}
details.card>summary.rw{display:flex;align-items:center;gap:7px;padding:6px 8px;cursor:pointer;list-style:none;min-width:0}
details.card>summary.rw::-webkit-details-marker{display:none}
details.card>summary.rw:hover{background:rgba(127,150,200,.08)}
summary.rw .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600}
summary.rw .sd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--mut);opacity:.6}
summary.rw .sd.ok{background:#34d399;opacity:1}summary.rw .sd.run{background:#fbbf24;opacity:1;box-shadow:0 0 0 3px rgba(251,191,36,.2)}
summary.rw .pc{font:600 10px ui-monospace,Consolas,monospace;color:var(--mut)}summary.rw .pc.warn{color:#fbbf24}summary.rw .pc.bad{color:#f87171}
summary.rw .eb{font:700 9.5px ui-monospace,Consolas,monospace;padding:1px 6px;border-radius:99px;background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.35)}
summary.rw .chev{opacity:.5;transition:transform .15s}details.card[open]>summary.rw .chev{transform:rotate(90deg)}
details.card[open]>*:not(summary){margin-left:10px;margin-right:10px}
details.card .sub{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:10.5px;margin-top:4px}details.card .sub .abrir{margin-left:auto}

details.card>summary.rw2{display:block;padding:7px 9px 8px;cursor:pointer;list-style:none}
details.card>summary.rw2::-webkit-details-marker{display:none}
details.card>summary.rw2:hover{background:rgba(127,150,200,.06)}
summary.rw2 .r1{display:flex;align-items:center;gap:6px;min-width:0}
summary.rw2 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600}
summary.rw2 .eb{font:700 9.5px ui-monospace,Consolas,monospace;padding:1px 6px;border-radius:99px;background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.35)}
summary.rw2 .chev{opacity:.5;transition:transform .15s}details.card[open]>summary.rw2 .chev{transform:rotate(90deg)}
summary.rw2 .ctx{margin-top:5px}summary.rw2 .ctxh{font-size:10px}
summary.rw2 .r3{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;margin-top:6px;font-size:10px}
summary.rw2 .r3 select{width:100%;max-width:100%;min-width:0;font-size:10px;padding:0 2px}
/* ===== Capa de diseño v3 (17-oct): nativo de VS Code, sobrio, denso ===== */
:root{
  --ds-fg:var(--vscode-foreground);
  --ds-mut:var(--vscode-descriptionForeground);
  --ds-bg:var(--vscode-sideBar-background,var(--vscode-editor-background));
  --ds-s1:color-mix(in srgb,var(--vscode-foreground) 3.5%,transparent);
  --ds-s2:color-mix(in srgb,var(--vscode-foreground) 7%,transparent);
  --ds-line:color-mix(in srgb,var(--vscode-foreground) 10%,transparent);
  --ds-line2:color-mix(in srgb,var(--vscode-foreground) 18%,transparent);
  --ds-acc:var(--vscode-focusBorder,#3b82f6);
  --ds-hover:var(--vscode-list-hoverBackground,color-mix(in srgb,var(--vscode-foreground) 6%,transparent));
  --ds-ok:#3fb950; --ds-run:#d29922; --ds-bad:#f85149;
  --ds-mono:var(--vscode-editor-font-family,ui-monospace,Consolas,monospace);
  --ds-r:4px;
  --run:var(--ds-run); --ok:var(--ds-ok); --bad:var(--ds-bad);
  --card:var(--ds-s1); --card2:var(--ds-s2); --line:var(--ds-line); --mut:var(--ds-mut);
}
body{font-family:var(--vscode-font-family);font-size:12px;line-height:1.45;font-variant-numeric:tabular-nums;letter-spacing:0}
button,select,input{font-family:inherit}
:focus-visible{outline:1px solid var(--ds-acc);outline-offset:1px}

/* encabezado */
.top{padding:6px 0 8px;border-bottom:1px solid var(--ds-line)}
.brand{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ds-mut)}

/* KPIs: celdas planas separadas por líneas */
.kgrid{border:1px solid var(--ds-line);border-radius:var(--ds-r);background:transparent;gap:0;overflow:hidden}
.kc{background:transparent!important;border:0!important;padding:7px 9px!important;border-radius:0!important}
.kc+.kc{border-left:1px solid var(--ds-line)!important}
.kc .l{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ds-mut)}
.kc .n{font-family:var(--ds-mono);font-size:17px;font-weight:600;letter-spacing:-.01em}
.kc .d{font-size:10px;color:var(--ds-mut)}
.kc.bad{background:color-mix(in srgb,var(--ds-bad) 6%,transparent)!important}
.kc[data-go]:hover{background:var(--ds-hover)!important}

/* panel de atención: filas con regla de color */
.atn{border:1px solid var(--ds-line);border-radius:var(--ds-r);background:transparent;overflow:hidden}
.atnh{padding:6px 9px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ds-mut);border-bottom:1px solid var(--ds-line)}
.atnh b{font-family:var(--ds-mono);font-weight:600;background:var(--ds-s2);border-radius:3px;padding:0 5px;color:var(--ds-fg)}
.atnr{padding:6px 9px;border-left:2px solid var(--ds-run);background:transparent}
.atnr.crit{border-left-color:var(--ds-bad)}
.atnr+.atnr{border-top:1px solid var(--ds-line)}
.atnr:hover{background:var(--ds-hover)}
.atni{width:16px!important;height:16px!important;font-size:10px!important;background:transparent!important;border:1px solid var(--ds-line2)!important}
.atnt b{font-weight:600}.atnt small{color:var(--ds-mut)}

/* pestañas: subrayado, sin cápsulas */
.seg{background:var(--ds-bg)!important;border:0!important;border-bottom:1px solid var(--ds-line)!important;border-radius:0!important;padding:0!important;gap:0!important;margin:10px 0 8px!important}
.seg button{flex:0 0 auto!important;padding:6px 9px!important;border-radius:0!important;font-size:11.5px;font-weight:500;color:var(--ds-mut);border-bottom:2px solid transparent!important;margin-bottom:-1px}
.seg button:hover{color:var(--ds-fg)}
.seg button.on{background:transparent!important;color:var(--ds-fg)!important;border-bottom-color:var(--ds-acc)!important}
.seg b{font-family:var(--ds-mono);font-size:10px;font-weight:500;opacity:.7}
.seg{flex-wrap:wrap!important;overflow:visible!important;row-gap:2px!important}

/* controles nativos */
select.proy,select.carp,.pick>summary{background:var(--vscode-dropdown-background)!important;color:var(--vscode-dropdown-foreground)!important;border:1px solid var(--vscode-dropdown-border,var(--ds-line2))!important;border-radius:3px!important;height:20px;font-size:11px!important}
.add input,#addt{height:24px;border-radius:3px!important;border:1px solid var(--vscode-input-border,var(--ds-line2))!important;background:var(--vscode-input-background)!important;color:var(--vscode-input-foreground)!important;font-size:12px!important;padding:0 8px!important}
.add button{height:24px;min-width:26px;border-radius:3px!important;background:var(--vscode-button-background)!important;color:var(--vscode-button-foreground)!important;border:0!important}
.add button:hover{background:var(--vscode-button-hoverBackground)!important}
.btnfix,.btnrep,.abrir,.docerr{background:var(--vscode-button-secondaryBackground,var(--ds-s2))!important;color:var(--vscode-button-secondaryForeground,var(--ds-fg))!important;border:1px solid transparent!important;border-radius:3px!important;font-size:11px!important;font-weight:500!important;padding:2px 8px!important;box-shadow:none!important}
.btnfix:hover,.btnrep:hover,.abrir:hover,.docerr:hover{background:var(--vscode-button-secondaryHoverBackground,var(--ds-hover))!important}
#quem{border-color:color-mix(in srgb,var(--ds-bad) 45%,transparent)!important;color:var(--ds-bad)!important;background:transparent!important;width:100%;text-align:left}
.abrir{display:inline-flex;align-items:center;gap:4px;padding:1px 6px!important;height:20px}
.abrir svg{width:11px;height:11px}

/* chips y estados */
.chip{background:transparent!important;border:1px solid var(--ds-line)!important;border-radius:3px!important;font-family:var(--ds-mono);font-size:10px!important;padding:0 5px!important;color:var(--ds-mut)}
.chip.bad{color:var(--ds-bad)!important;border-color:color-mix(in srgb,var(--ds-bad) 40%,transparent)!important}
.chip.warn{color:var(--ds-run)!important;border-color:color-mix(in srgb,var(--ds-run) 40%,transparent)!important}
.pill{background:transparent!important;border:0!important;padding:0!important;font-size:10.5px!important;font-weight:500!important;color:var(--ds-mut)!important;text-transform:none!important;letter-spacing:0!important;gap:5px}
.pill i{width:6px!important;height:6px!important;background:var(--ds-mut);opacity:.6}
.pill.ok{color:var(--ds-fg)!important}.pill.ok i{background:var(--ds-ok);opacity:1}
.pill.run{color:var(--ds-fg)!important}.pill.run i{background:var(--ds-run);opacity:1}
.pill.bad i{background:var(--ds-bad);opacity:1}

/* barras finas */
.bar,.ctxb,.prog,.mbar{height:3px!important;border-radius:2px!important;background:var(--ds-s2)!important}
.bar>i,.ctxb>i,.prog>i{border-radius:2px!important;background:var(--ds-acc)!important}
.ctxb.warn>i{background:var(--ds-run)!important}.ctxb.bad>i{background:var(--ds-bad)!important}
.ctxh{font-size:10.5px!important;color:var(--ds-mut)}.ctxh b{font-family:var(--ds-mono);font-weight:500;color:var(--ds-fg)}
.ctxw{font-size:10.5px!important;color:var(--ds-bad)!important}

/* grupos: proyecto = cabecera de sección, carpeta = fila de árbol */
.pgrp{margin:12px 0 2px!important;font-size:10.5px!important;font-weight:600!important;letter-spacing:.06em!important;color:var(--ds-mut)!important}
.pgrp::after{background:var(--ds-line)!important;opacity:1!important}
.dgrp{height:24px;margin:2px 0!important;padding:0 6px!important;border:0!important;border-radius:3px!important;background:transparent!important;font:500 12px/1 var(--vscode-font-family)!important;letter-spacing:0!important;text-transform:none!important;color:var(--ds-fg)}
.dgrp:hover{background:var(--ds-hover)!important}
.dgrp .chv{opacity:.6}.dgrp .fi{color:var(--ds-mut)!important;width:14px;height:14px}
.dgrp .cnt{background:transparent!important;border:0!important;color:var(--ds-mut)!important;font-family:var(--ds-mono);font-size:10.5px!important;padding:0!important}
.dgrp .gb{opacity:0!important;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;color:var(--ds-mut)}
.dgrp:hover .gb{opacity:.8!important}.dgrp .gb:hover{opacity:1!important;background:var(--ds-s2);color:var(--ds-fg)}
.dgrp .gb svg{width:13px;height:13px}
.dgrp .gi{border-color:var(--ds-acc)!important;height:20px;font-size:12px}

/* tarjetas de sesión = filas de lista */
details.card{margin:0!important;border:0!important;border-left-width:2px!important;border-left-style:solid!important;border-radius:0!important;background:transparent!important;border-bottom:1px solid var(--ds-line)!important}
details.card:hover{background:var(--ds-hover)!important}
details.card[open]{background:var(--ds-s1)!important}
details.card>summary.rw2{padding:7px 8px 8px 10px!important}
summary.rw2 .nm{font-size:12px!important;font-weight:500!important}
summary.rw2 .eb{font-family:var(--ds-mono)!important;background:transparent!important;border-color:color-mix(in srgb,var(--ds-bad) 45%,transparent)!important;color:var(--ds-bad)!important;border-radius:3px!important}
summary.rw2 .r3{color:var(--ds-mut)}
.quedo{background:transparent!important;border:0!important;border-left:2px solid var(--ds-line2)!important;border-radius:0!important;padding:2px 0 2px 8px!important;font-size:11px;color:var(--ds-mut)}
.quedo b{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ds-mut)}

/* subagentes */
.ag{border-radius:0!important;background:transparent!important;border:0!important;border-top:1px solid var(--ds-line)!important}
.av{border-radius:3px!important}
.grp{font-size:10.5px!important;font-weight:600!important;letter-spacing:.06em!important;text-transform:uppercase!important;color:var(--ds-mut)!important}
.empty{color:var(--ds-mut);font-size:11.5px}
.note{color:var(--ds-mut);font-size:10.5px}

/* selectores fantasma en tarjetas: sin caja hasta hover/foco */
summary.rw2 .r3>span{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
summary.rw2 .r3 select.proy,summary.rw2 .r3 select.carp{background:transparent!important;border-color:transparent!important;color:var(--ds-fg)!important;padding-left:2px;cursor:pointer}
summary.rw2 .r3 select.proy:hover,summary.rw2 .r3 select.carp:hover{border-color:var(--ds-line2)!important}
summary.rw2 .r3 select.proy:focus,summary.rw2 .r3 select.carp:focus{background:var(--vscode-dropdown-background)!important;border-color:var(--ds-acc)!important}
summary.rw2 .r3 select option{background:var(--vscode-dropdown-background);color:var(--vscode-dropdown-foreground)}
.ctxh{margin-top:2px}

/* pestaña Ideas */
.ifil{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.ipara{background:transparent;border:1px solid var(--ds-line);color:var(--ds-mut);border-radius:3px;font-size:11px;padding:1px 7px;cursor:pointer}
.ipara:hover{color:var(--ds-fg);border-color:var(--ds-line2)}
.ipara.on{color:var(--ds-fg);border-color:var(--ds-acc);background:color-mix(in srgb,var(--ds-acc) 12%,transparent)}
details.idea{border-bottom:1px solid var(--ds-line);border-left:2px solid transparent}
details.idea:hover{background:var(--ds-hover)}
details.idea[open]{background:var(--ds-s1);border-left-color:var(--ds-acc)}
details.idea>summary{list-style:none;cursor:pointer;padding:6px 8px}
details.idea>summary::-webkit-details-marker{display:none}
.idea .it{display:flex;gap:8px;align-items:baseline}
.idea .it b{flex:1;min-width:0;font-weight:500;font-size:12px}
.idea .iu{font-family:var(--ds-mono);font-size:10px;color:var(--ds-ok);white-space:nowrap}
.idea .im{display:flex;gap:5px;font-size:10.5px;color:var(--ds-mut);margin-top:2px;min-width:0}
.idea .im span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea .ia{opacity:.6}.idea .if{margin-left:auto;font-family:var(--ds-mono)}
.idea .ib{padding:0 8px 8px 10px;font-size:11.5px}
.idea .ib p{margin:0 0 6px;line-height:1.5}
.idea .ie{font-size:10.5px;color:var(--ds-mut);margin-top:4px;word-break:break-word}
.btnrep.aport{margin:4px 0}
[hidden]{display:none!important}
.ibtns{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.ibtns .btnrep.aport{margin:0}
.idea .iu.pend{color:var(--ds-run)}
details.conv.abierta{border-left-color:color-mix(in srgb,var(--ds-run) 60%,transparent)}
.conv .resp{border-left:2px solid var(--ds-line2);padding:2px 0 2px 8px;margin:4px 0 6px}
.conv .resp p{margin:2px 0 0}
summary.rw2 .ibtns.r4{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 0}
summary.rw2 .ibtns.r4 .btnrep{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:22px;padding:0 8px!important;font-size:11px!important;width:100%}
summary.rw2 .ibtns.r4 svg{width:12px;height:12px;flex:none}
.dgrp.vacia{cursor:default}.dgrp.vacia .nm2{color:var(--ds-mut)}
.nses-vacia{display:flex!important;align-items:center;gap:5px;margin:0 0 6px 26px;height:22px;padding:0 8px;border:1px dashed var(--ds-line2)!important;border-radius:3px;background:transparent;color:var(--ds-mut);font-size:11px;cursor:pointer;opacity:1!important;width:auto!important}
.nses-vacia:hover{color:var(--ds-fg);border-color:var(--ds-acc)!important}
.nses-vacia svg{width:12px;height:12px}
.delses{display:inline-flex;align-items:center;gap:4px;height:20px;min-width:22px;justify-content:center;padding:0 4px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--ds-mut);cursor:pointer;opacity:0;transition:opacity .1s}
details.card:hover .delses,.delses.conf{opacity:1}.delses:hover{color:var(--ds-bad);background:color-mix(in srgb,var(--ds-bad) 10%,transparent)}
.delses svg{width:12px;height:12px}.delses span:empty{display:none}
.delses.conf{color:var(--ds-bad);border-color:color-mix(in srgb,var(--ds-bad) 50%,transparent);font-size:11px;padding:0 6px}
summary.rw2 .nm .pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* Curvas de aprendizaje (18-oct) */
.apr{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:8px 10px;margin-bottom:6px;box-shadow:inset 2px 0 0 var(--ok)}
.apr.ambar{box-shadow:inset 2px 0 0 var(--run)}.apr.rojo{box-shadow:inset 2px 0 0 var(--bad)}
.apr .ah{display:flex;align-items:center;gap:8px}.apr .ah b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apr .ins{margin-top:4px;font-size:10.5px;color:var(--mut)}
.apr .agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.apr .am{min-width:0}.apr .am small{display:block;font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apr .am strong{display:block;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.apr .tr{display:block;font-size:10px;font-variant-numeric:tabular-nums;white-space:normal;line-height:1.25}
.apr .tr.tdn{color:var(--ok)}.apr .tr.tup{color:var(--bad)}.apr .tr.teq{color:var(--mut)}
.apr svg.sp{display:block;width:100%;height:auto;margin-top:6px;color:var(--vscode-foreground)}
.apr .amem{margin-top:6px;font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.apr .aal{margin-top:5px;padding:3px 7px;border-left:2px solid var(--run);background:color-mix(in srgb,var(--run) 12%,transparent);font-size:10.5px;line-height:1.3}
.apr .aal.rojo{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.prs{display:flex;gap:6px;margin:2px 0 4px;flex-wrap:wrap}
.prc{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);padding:3px 8px;border:1px solid var(--line);border-radius:999px}
.prc i{width:7px;height:7px;border-radius:50%}.prc b{color:var(--vscode-foreground);font-weight:600}
.prc.alta i,.pd.alta{background:var(--bad)}.prc.media i,.pd.media{background:var(--run)}.prc.baja i,.pd.baja{background:var(--sonnet)}
.pd{min-width:16px;height:16px;padding:0 4px;border-radius:8px;color:#111;font:700 9.5px/16px ui-monospace,Consolas,monospace;text-align:center}
.vents{display:flex;flex-wrap:wrap;gap:4px;margin:-2px 0 8px 2px}
.vch{display:inline-flex;align-items:center;gap:5px;max-width:100%;border:1px solid var(--line);background:var(--card);color:var(--vscode-foreground);border-radius:6px;padding:2px 7px;font:inherit;font-size:10.5px;cursor:pointer}
.vch:hover{background:var(--card2)}.vch i{width:6px;height:6px;border-radius:50%;flex:none}.vch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vch b{font:600 10px ui-monospace,Consolas,monospace;color:var(--mut)}.vch b.w{color:var(--run)}.vch b.r{color:var(--bad)}
.vlink{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.vlink.vacio .vsel{display:none}.task:hover .vlink.vacio .vsel,.vlink.vacio:focus-within .vsel{display:inline-block}
.task:hover .vlink.vacio .vhint,.vlink.vacio:focus-within .vhint{display:none}
.vmas{display:none;gap:4px;align-items:center}.task:hover .vmas,.vmas:focus-within{display:inline-flex}
.vreal{border:0;border-radius:6px;padding:2px 8px;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;background:var(--vscode-button-background);color:var(--vscode-button-foreground)}
.vreal:hover{filter:brightness(1.15)}
.vauto.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);border-style:solid}

  const porProy=new Map();V.forEach(i=>{const k=i.proyecto||'Sin proyecto';if(!porProy.has(k))porProy.set(k,[]);porProy.get(k).push(i)});
  if(!V.length)h+='<div class="empty">Aún no hay ideas'+(fp?' para «'+e(fp)+'»':'')+'. Usa «Aportar ideas» en una sesión del Monitor.</div>';

   h+='<div class="grp"><span>'+e(k)+'</span><span>'+L.length+'</span></div>';

 }else if(ui.tab==='uso'){
  const UM=d.usoMapa||{dias:[],celdas:[]};const DD=UM.dias||[];

  DD.forEach(dd=>{h+='<span class="hy">'+lab(dd)+'</span>';for(let i=0;i<24;i++){const v=g.get(dd+'|'+i)||0;const a=v?Math.round(20+80*Math.pow(v/mx,.6)):0;h+='<i title="'+lab(dd)+' · '+i+':00 · '+tb(v)+' tokens"'+(a?' style="background:color-mix(in srgb,var(--ok) '+a+'%,var(--card))"':'')+'></i>'}});

 }else if(ui.tab==='hist'){
  const H=(d.historial||[]).map(x=>({dia:x.dia,items:x.items.filter(i=>ui.filtro==='todos'||i.proy===ui.filtro)}));

  const por=new Map();HA.forEach(x=>x.items.forEach(i=>{const u=por.get(i.tipo)||{tipo:i.tipo,n:0,e:0,sc:0,h:0,c:0};u.n++;u.e+=i.e||0;u.sc+=i.sc||0;u.h+=i.h||0;u.c+=i.c||0;por.set(i.tipo,u)}));
  const M=[...por.values()].filter(u=>u.n>=2).map(u=>Object.assign(u,{tasa:u.h?u.sc/u.h:0})).sort((a,b)=>b.tasa-a.tasa||b.c-a.c).slice(0,8);

  const PT=new Map();H.forEach(x=>x.items.forEach(i=>Object.entries(i.pt||{}).forEach(([tn,v])=>{const u=PT.get(tn)||{tool:tn,e:0,sc:0,dias:new Set()};u.e+=v[0]||0;u.sc+=v[1]||0;u.dias.add(x.dia);PT.set(tn,u)})));

 }else{

  const ORG=d.org.filter(n=>ui.filtro==='todos'||!n.proy||n.proy===ui.filtro);
  const sin=ORG.filter(n=>!usados.has(n.name));

  [...new Set(ORG.map(n=>n.grupo))].forEach(g=>{
   const del=ORG.filter(n=>n.grupo===g);const nom=new Set(del.map(n=>n.name.toLowerCase()));const seen=new Set();

   const pintar=n=>{if(seen.has(n.name))return '';seen.add(n.name);const r=trab.has(n.name);const hs=hijos(n.name.toLowerCase());

   h+='<div class="grp"><span>Organigrama · '+e(g)+'</span><span>'+del.length+'</span></div>'+del.filter(n=>!n.parent||!nom.has(n.parent)).sort((a,b)=>hijos(b.name.toLowerCase()).length-hijos(a.name.toLowerCase()).length).map(pintar).join('')});
